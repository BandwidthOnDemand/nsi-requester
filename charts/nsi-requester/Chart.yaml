apiVersion: v2
name: nsi-requester
description: Helm chart to deploy nsi-requester to Kubernetes

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Placeholder only. The chart version is the release git tag, injected by
# .github/workflows/chart.yml:  helm package --version $TAG
# Do not maintain this number by hand.
version: 0.0.0

# This chart packages a third-party application, so appVersion pins the upstream
# container image tag and is NOT derived from the git tag. Maintain it by hand
# and keep it matching a real tag of ghcr.io/bandwidthondemand/nsi-requester.
appVersion: "1.1.1"

annotations:
  org.opencontainers.image.source: https://github.com/BandwidthOnDemand/nsi-requester
